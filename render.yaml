services:
  - type: web
    name: etickting
    runtime: python
    buildCommand: pip install . && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: uvicorn config.asgi:application --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: etickting-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: etickting.onrender.com
databases:
  - name: etickting-db
