<div class="state-panel state-error" role="alert"><span class="state-icon" aria-hidden="true">!</span><h2 class="h5">{{ heading|default:"Something went wrong" }}</h2><p>{{ message|default:"We could not complete that request. Please try again." }}</p>{% if retry_url %}<a class="btn btn-primary" href="{{ retry_url }}">Try again</a>{% endif %}<a class="btn btn-outline-secondary" href="{% url 'contact' %}">Contact support</a></div>
