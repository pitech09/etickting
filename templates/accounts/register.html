{% extends "base.html" %}{% block title %}Create account · eTickting{% endblock %}{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <h1 class="h3 mb-3">Create your account</h1>
        <form method="post" class="card card-body shadow-sm">{% csrf_token %}{{ form.as_p }}
            <button class="btn btn-primary">Create account</button>
        </form>
        <p class="mt-3">Already registered? <a href="{% url 'login' %}">Log in</a>.
        </p>
    </div>
</div>
{% endblock %}
