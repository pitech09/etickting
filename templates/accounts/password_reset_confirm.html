{% extends "base.html" %}
{% block title %}Enter reset code · Kena{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="page-intro"><p class="eyebrow mb-2">Account recovery</p><h1 class="h2">Enter your reset code</h1><p class="text-secondary">Use the six-digit code sent to your verified phone.</p></div><section class="card card-body"><form method="post" class="form-system">{% csrf_token %}<label class="form-label" for="code">SMS code</label><input class="form-control" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><label class="form-label mt-3" for="new_password1">New password</label><input class="form-control" id="new_password1" name="new_password1" type="password" autocomplete="new-password" required><label class="form-label mt-3" for="new_password2">Confirm new password</label><input class="form-control" id="new_password2" name="new_password2" type="password" autocomplete="new-password" required><button class="btn btn-primary mt-3" type="submit">Reset password</button></form></section></div></div>
{% endblock %}
