{% extends "base.html" %}
{% block title %}Reset password · Kena{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="page-intro"><p class="eyebrow mb-2">Account recovery</p><h1 class="h2">Reset your password</h1><p class="text-secondary">Enter the verified phone number on your account.</p></div><section class="card card-body"><form method="post" class="form-system">{% csrf_token %}<label class="form-label" for="phone">Phone number</label><input class="form-control" id="phone" name="phone" placeholder="+266 5XXX XXXX" autocomplete="tel" required><button class="btn btn-primary mt-3" type="submit">Send reset code</button></form></section></div></div>
{% endblock %}
