{% load static %}
<!doctype html>
<html lang="en-LS">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}eTickting{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --ink: #172033; --brand: #3056d3; }
    body { color: var(--ink); }
    .navbar-brand { letter-spacing: .02em; }
    .hero { background: linear-gradient(135deg, #172554, #3056d3); color: white; border-radius: 1rem; }
    .card { border: 0; border-radius: .85rem; }
    .form-control:focus, .form-select:focus, .btn:focus { box-shadow: 0 0 0 .2rem rgba(48,86,211,.25); }
  </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
  <div class="container"><a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">eTickting</a>
    <div class="d-flex align-items-center gap-3"><a class="link-light small text-decoration-none" href="{% url 'ticketing:ticket-public-verify-page' %}">Verify ticket</a>{% if user.is_authenticated %}<span class="text-white small d-none d-md-inline">{{ user.email }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-light btn-sm">Log out</button></form>{% else %}<a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Log in</a>{% endif %}</div>
  </div>
</nav>
<main class="container py-4">{% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main>
</body>
</html>
